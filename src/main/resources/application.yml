spring:
  application:
    name: spring-ai-enterprise-lab

ai:
  openai:
    api-key: ${OPENAI_API_KEY:demo-key-replace-me}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
